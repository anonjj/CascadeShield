server:
  port: 8080

spring:
  application:
    name: gateway-service

downstream:
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        # false = CB state visible in health but does not flip overall service status to DOWN
        allow-health-indicator-to-fail: false
        sliding-window-type: ${CB_SLIDING_WINDOW_TYPE:COUNT_BASED}
        sliding-window-size: ${CB_SLIDING_WINDOW_SIZE:10}
        # Must be reachable within the window. Resilience4j defaults this to 100, which a
        # 5-20 call/second window never reaches in a short run, so the breaker never
        # evaluates (esp. TIME_BASED). Exposed + defaulted low so every swept window fills.
        minimum-number-of-calls: ${CB_MINIMUM_CALLS:5}
        failure-rate-threshold: ${CB_FAILURE_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${CB_WAIT_DURATION_OPEN:15s}
        permitted-number-of-calls-in-half-open-state: ${CB_PERMITTED_CALLS_HALF_OPEN:5}
        automatic-transition-from-open-to-half-open-enabled: true
        # Slow-call tracking: calls > 2s count as slow (latency fault injects 3s)
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: ${CB_FAILURE_RATE_THRESHOLD:50}
        # Ring-buffer size for /actuator/circuitbreakerevents (per breaker instance).
        # runner.py polls this to record real CLOSED/OPEN/HALF_OPEN transitions --
        # error_rate/blast_radius alone can't distinguish "breaker stayed closed"
        # from "breaker tripped on the slow-call path" (a >2s call returning 200
        # scores 0% failure rate but 100% slow-call rate).
        event-consumer-buffer-size: ${CB_EVENT_BUFFER_SIZE:50}
        record-exceptions:
          - com.cascadeshield.gateway.exception.DownstreamUnavailableException
        ignore-exceptions:
          - com.cascadeshield.gateway.exception.DownstreamRejectedException
      # ---- measurement-plane -------------------------------------------------
      # The gateway is the MEASUREMENT PLANE, not an experimental subject. An edge
      # breaker observes the SUMMED latency of the whole downstream chain
      # (gateway -> order -> inventory, where the 3000ms toxic sits), so with the
      # swept CB_* config it always crosses the slow-call threshold and trips BEFORE
      # any interior breaker can — starving the rest of the chain of traffic and
      # collapsing blast radius onto a single node (the gateway CB confound).
      # These values are HARDCODED (no ${CB_*}) so the gateway breaker NEVER opens
      # and never distorts the sweep; only the five downstream services remain
      # experimental subjects driven by the swept CB_* env vars.
      measurement-plane:
        register-health-indicator: true      # keep exporting CB metrics for diagnostics
        allow-health-indicator-to-fail: false
        minimum-number-of-calls: 1000000     # evaluation window is never reached
        failure-rate-threshold: 100          # would need 100% failures to trip
        slow-call-rate-threshold: 100        # would need 100% slow calls to trip
        slow-call-duration-threshold: 60s    # nothing in-test is this slow
    instances:
      # All three gateway breakers use measurement-plane (never open) — see above.
      orderServiceCB:
        base-config: measurement-plane
      inventoryServiceCB:
        base-config: measurement-plane
      paymentServiceCB:
        base-config: measurement-plane

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,circuitbreakers,circuitbreakerevents,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
